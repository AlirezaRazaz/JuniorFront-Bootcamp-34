<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Quiz</title>
    <link rel="stylesheet" href="./DO_NOT_CHANGE.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <section class="first">
      <div class="blue">
        <div class="wrapper_1 box white">
          <div class="box purple purple_1">
            <p>Line 1</p>
          </div>
          <div class="box purple purple_2">
            <div>Line 1</div>
            <div>Line 2</div>
            <div>Line 3</div>
            <div>Line 4</div>
            <div>Line 5</div>
          </div>
        </div>
      </div>
    </section>
    <section class="second">
      <div class="wrapper_2 box yellow">
        <div class="box pink">1</div>
        <div class="box pink">2</div>
        <div class="box pink">3</div>
        <div class="box pink">4</div>
      </div>
    </section>
    <section class="third">
      <div class="pink wrapper_3">
        <div class="box white wrapper_4 white_2">
          <div class="box dark">1</div>
          <div class="box dark">2</div>
          <div class="box dark">3</div>
        </div>
        <div class="box white wrapper_4 wrapper_4_1 white_1">
          <div class="box dark">1</div>
          <div class="box dark">2</div>
          <div class="box dark">3</div>
        </div>
        <div class="box white wrapper_4 white_2">
          <div class="box dark">1</div>
          <div class="box dark">2</div>
          <div class="box dark">3</div>
        </div>
      </div>
    </section>
  </body>
</html>
