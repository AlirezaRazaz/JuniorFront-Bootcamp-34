<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Quiz</title>
    <link rel="stylesheet" href="DO_NOT_CHANGE.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="container">
      <div class="box1">
        <div class="l1 purple">line1</div>
        <div class="l2 purple">
          <ul>
            <li>line1</li>
            <li>line2</li>
            <li>line3</li>
            <li>line4</li>
            <li>line5</li>
            <li>line6</li>
          </ul>
        </div>
      </div>
    </header>
    <main class="container white">
      <div class="box2 yellow">
        <ul class="ul-wrapper">
          <li class="pink">1</li>
          <li class="pink">2</li>
          <li class="pink">3</li>
          <li class="pink">4</li>
        </ul>
      </div>
    </main>
    <div class="main2 container pink">
      <div class="section">
        <div class="box3 dark">
          <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
          </ul>
        </div>
        <div class="box4 dark">
          <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
          </ul>
        </div>
        <div class="box5 dark">
          <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
