<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/styles/index.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">SnapDrop</div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <div class="flex align-center">
            <div>
              <div class="hero-content">
                <h1 class="hero-title">
                  Ready to Share your local files with <br />
                  your friends?
                </h1>
                <p class="hero-desc">
                  Snapdrop is a local file sharing solution which completely
                  works in your browser. A bit like Apple's Airdrop, but not
                  only for Apple devices.
                </p>
              </div>
              <ul class="flex store-list">
                <li class="store-item">
                  <a class="store-link" href="#" title="get on Google Play">
                    <img
                      class="store-img"
                      src="assets/images/btns/google_play.png"
                      alt="google play btn"
                    />
                  </a>
                </li>
                <li class="store-item">
                  <a class="store-link" href="#" title="get on F-Droid">
                    <img
                      class="store-img"
                      src="assets/images/btns/f-droid.png"
                      alt="f-droid btn"
                    />
                  </a>
                </li>

                <li class="store-item">
                  <a class="store-link" href="#" title="get on F-Droid">
                    <img
                      class="store-img"
                      src="assets/images/btns/f-droid-2.png"
                      alt="f-droid btn"
                    />
                  </a>
                </li>
              </ul>
            </div>
            <img
              class="hero-img"
              src="assets/images/screenshots/main.png"
              alt="screenshot"
            />
          </div>
        </div>
      </section>
      <section class="featured">featured</section>
      <section class="features">features</section>
      <section class="testimonial">testimonial</section>
    </main>
    <footer class="footer">footer</footer>
  </body>
</html>
